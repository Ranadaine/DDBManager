[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddbmanager"
version = "0.1.0"
description = "A simple DuckDB manager wrapper for Python"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Ranadaine", email = "ranadaine@example.com"}
]
keywords = ["duckdb", "database", "manager", "wrapper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "duckdb",
    "pandas",
]

[project.urls]
Homepage = "https://github.com/Ranadaine/DDBManager"
Repository = "https://github.com/Ranadaine/DDBManager.git"
Issues = "https://github.com/Ranadaine/DDBManager/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ddbmanager*"]